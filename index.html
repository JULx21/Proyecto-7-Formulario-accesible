<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formulario Accesible - Julián Andrés Morales Cubides</title>
    <link rel='stylesheet' href='css/style.css'>
</head>
<body>
    <div class="tarjeta">
        <div class="tarjeta1">
            <form  action="guardar.php" method="post">

                <label for="nombre"><br>Nombre Completo</br></label>
                    <input class="nombreC" placeholder="Ingrese su nombre completo" type="text" id="nombre" name="nombre" required minlength="3"  aria-required="true"  required>
                        <br>
                            <small class="error">Ingresa tu nombre completo.</small>
                    <div class="campo-correo">
                    <label for="correo"><br>Correo electronico<br></label>
                        <input class="correo" placeholder="josecarabali@gmail.com" type="email" id="correo" required name="correo" aria-required="true"
                                required aria-describedby="ayuda-correo" required       >
                            <br>
                                <small class="error" id="ayuda-correo">el correo es obligatorio</small>
                </div>
                <label for="contraseña"><br>Ingrese su contraseña</br></label>
                    <input class="contraseña" placeholder="********" type="password" id="contraseña" name="contraseña" aria-required="true" required>            
                        <button class="ojito" type="button" onclick="mostarPassword()"><strong>👁</strong></button>
                <label for="confirmcontra"><br>Confirme su contraseña</br></label>
                    <input class="contraseña"  placeholder="********" type="password" id="confirmcontra" name="confirmcontra" aria-required="true" required>            
                        <button class="ojito" type="button" onclick="mostarPassword()"><strong>👁</strong></button>
            <br></br>
                <div class="crear-perfil">
                    <button type="button" href="futuro.css">Crear Perfil </button>
                </div>
            </form>
        </div>

        <div class="tarjeta2">
            <div class="progreso">
                <span>65%</span>
            </div>
            <div class="perfil-completado">
                <p>Perfil Completado</p>
            </div>

            <main class="tarjeta3">
                <s> Cuenta Creada</s>
                    <br>
                <s>Barra de Progreso Completada</s>
                    <br>
                <s>Perfil creado</s>
                    <br>
                <s class="linea-mitad">Cree su primer proyecto</s>
                    <br>
                <s class="linea-mitad">Invite un amigo</s>
            </main>

        </div>
        
    </div>

</body>
</html>
